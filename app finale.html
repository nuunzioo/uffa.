<style>
/* ===== TOKENS ===== */
:root{--bg:#0c0d10;--s1:#15171b;--s2:#1d1f24;--ln:rgba(255,255,255,.08);--tx:#eceae4;--mu:#878a92;--ac:#e4d2a6;--ia:#b9c6de;--sh:0 8px 30px rgba(0,0,0,.28);--glass:rgba(255,255,255,.05);--k:1;--fs:16px;
--serif:'Instrument Serif',Georgia,serif;--sans:-apple-system,'SF Pro Text',system-ui,sans-serif;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);font-size:var(--fs)}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--tx);font-family:var(--sans);overflow:hidden;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:left}
:focus-visible{outline:1px solid var(--ia);outline-offset:3px}
*::-webkit-scrollbar{display:none}*{scrollbar-width:none}
#app{position:relative;height:var(--vh,100%);overflow:hidden}
/* ===== SCREENS ===== */
.screen{position:absolute;inset:0;overflow-y:auto;padding:0 1.4rem 3rem;background:var(--bg);opacity:0;transform:translateY(14px);transition:filter calc(.6s*var(--k)),opacity calc(.45s*var(--k)),transform calc(.5s*var(--k)) cubic-bezier(.2,.7,.2,1)}
.screen.on{opacity:1;transform:none;filter:none}
html[data-m=cin] .screen{filter:blur(8px)}
html[data-m=cin] .screen.on{filter:none}
.bar{position:sticky;top:0;height:3.4rem;display:flex;align-items:center;background:var(--bg);z-index:2}
.bk{width:2.75rem;height:2.75rem;display:grid;place-items:center;margin-left:-.6rem;color:var(--mu)}
h1{font:400 2.5rem/1.05 var(--serif);letter-spacing:-.01em;margin:.3rem 0 1.5rem}
.mu{color:var(--mu)}.sm{font-size:.85rem}
/* ===== CARDS ===== */
.card{display:block;width:100%;box-sizing:border-box;background:var(--s1);border:.5px solid var(--ln);border-radius:1.3rem;padding:1.1rem 1.2rem;box-shadow:var(--sh);transition:transform calc(.2s*var(--k))}
html[data-card=glass] .card{background:var(--glass);-webkit-backdrop-filter:blur(20px) saturate(1.3);backdrop-filter:blur(20px) saturate(1.3)}
html[data-card=editorial] .card{background:transparent;box-shadow:none;border-radius:0;border-width:0 0 .5px 0;padding-left:.1rem;padding-right:.1rem}
.tap:active{transform:scale(.978)}
.row{display:flex;justify-content:space-between;align-items:center;margin-bottom:.75rem;font:1.3rem var(--serif)}
.tag{font:.72rem var(--sans);color:var(--mu);border:.5px solid var(--ln);border-radius:1rem;padding:.22rem .65rem}
/* ===== HOME ===== */
.top{display:flex;justify-content:space-between;align-items:center;height:3.6rem}
.logo{font:1.55rem var(--serif)}
.ic{display:flex;gap:.6rem}
.cb{width:2.4rem;height:2.4rem;border-radius:50%;border:.5px solid var(--ln);background:var(--s1);display:grid;place-items:center;color:var(--mu)}
.ini{font:1.1rem var(--serif);color:var(--tx);text-align:center}
.hi{font:italic 1.2rem var(--serif);color:var(--mu);margin:.7rem 0 0}
.hero{height:9.5rem;display:flex;align-items:center;justify-content:space-between;font:2.2rem var(--serif);margin-top:1.1rem}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:.8rem;margin-top:.8rem}
.sq{height:6.8rem;display:flex;align-items:flex-end;font:1.4rem var(--serif)}
.gift{margin-top:1.6rem;display:inline-flex;align-items:center;gap:.65rem;border:.5px solid var(--ln);border-radius:2rem;padding:.8rem 1.15rem;color:var(--ac);font-size:.92rem;opacity:0;transition:opacity calc(1.2s*var(--k))}
.gift.on{opacity:1}
.dot{width:.42rem;height:.42rem;border-radius:50%;background:var(--ac);animation:br calc(3.2s*var(--k)) ease-in-out infinite}
.it{opacity:0;transform:translateY(10px);animation:in calc(.9s*var(--k)) cubic-bezier(.2,.7,.2,1) both;animation-delay:calc(var(--i)*.1s*var(--k))}
@keyframes in{to{opacity:1;transform:none}}
@keyframes br{50%{transform:scale(1.25);opacity:.55}}
/* ===== TI PENSO / QUI ===== */
.center{min-height:calc(100% - 7rem);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1.4rem;text-align:center}
.orb{position:relative;width:12rem;height:12rem;border-radius:50%;display:grid;place-items:center;border:.5px solid var(--ln);background:radial-gradient(circle at 50% 30%,color-mix(in srgb,var(--ac) 16%,transparent),var(--s1) 70%);box-shadow:var(--sh);font:2rem var(--serif);text-align:center;transition:transform calc(.3s*var(--k))}
.orb:active{transform:scale(.96)}
.orb.q{width:9rem;height:9rem;animation:br calc(7s*var(--k)) ease-in-out infinite}
.ring{position:absolute;inset:0;border-radius:50%;border:1px solid var(--ac);opacity:.6;pointer-events:none;animation:rg calc(1.8s*var(--k)) ease-out forwards}
@keyframes rg{to{transform:scale(2.2);opacity:0}}
html[data-m=min] .inf,html[data-m=min] .dot,html[data-m=min] .orb.q{animation:none!important}
@media(prefers-reduced-motion:reduce){.inf,.dot,.orb.q{animation:none!important}}
/* ===== RICORDI ===== */
.tl{position:relative;padding-left:1.6rem}
.tl:before{content:'';position:absolute;left:.3rem;top:.4rem;bottom:.4rem;width:.5px;background:var(--ln)}
.m{position:relative;margin-bottom:1.9rem}
.m:before{content:'';position:absolute;left:-1.52rem;top:.5rem;width:.45rem;height:.45rem;border-radius:50%;background:var(--mu)}
.m:first-child:before{background:var(--ac)}
.m b{display:block;font:400 1.4rem var(--serif);margin:.15rem 0 .3rem}
/* ===== SETTINGS ===== */
.set{margin-bottom:1.5rem}
.set label{display:block;font-size:.85rem;color:var(--mu);margin-bottom:.55rem}
.seg{display:flex;gap:.2rem;padding:.2rem;background:var(--s2);border-radius:.9rem}
.seg button{flex:1;text-align:center;font-size:.85rem;color:var(--mu);padding:.6rem 0;border-radius:.7rem;transition:all calc(.25s*var(--k))}
.seg button.on{background:var(--s1);color:var(--tx);box-shadow:0 1px 4px rgba(0,0,0,.18)}
.av{width:5rem;height:5rem;border-radius:50%;border:.5px solid var(--ln);background:var(--s1);display:grid;place-items:center;font:2rem var(--serif)}
.slim{height:4.4rem;display:flex;align-items:center;justify-content:space-between;font:1.55rem var(--serif);margin-top:.8rem;padding-top:0;padding-bottom:0}
.cta{text-align:center;color:var(--ia);border-color:var(--ia);margin-top:1rem}
.pg{display:grid;grid-template-columns:repeat(3,1fr);gap:.55rem}
.sw{position:relative;background:var(--b);color:var(--t);border:.5px solid var(--ln);border-radius:1rem;padding:1.6rem .4rem .65rem;font-size:.72rem;text-align:center;transition:all calc(.25s*var(--k))}
.sw:before{content:'';position:absolute;top:.65rem;left:50%;width:.9rem;height:.9rem;margin-left:-.45rem;border-radius:50%;background:var(--a)}
.sw.on{outline:1.5px solid var(--ia);outline-offset:2px}
.sw input{position:absolute;inset:0;width:100%;height:100%;opacity:0}
.fp{display:flex;justify-content:space-between;align-items:center;width:100%;box-sizing:border-box;padding:.75rem 1rem;border:.5px solid var(--ln);border-radius:.9rem;margin-bottom:.5rem;color:var(--mu)}
.fp b{font-weight:400;font-size:1.4rem;color:var(--tx)}
.fp small{font-size:.8rem}
.fp.on{border-color:var(--ia);color:var(--tx)}
.screen.chat{display:flex;flex-direction:column;overflow:hidden;padding-bottom:0}
.msgs{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;gap:1rem;padding:.4rem 0 .8rem}
.b{max-width:86%;opacity:0;transform:translateY(8px);animation:in calc(.5s*var(--k)) ease both}
.b.u{align-self:flex-end;background:var(--s2);padding:.65rem .95rem;border-radius:1.2rem 1.2rem .3rem 1.2rem;font-size:.95rem;line-height:1.4;-webkit-user-select:text;user-select:text}
.b.a{font:1.2rem/1.35 var(--serif);-webkit-user-select:text;user-select:text}
.typ{display:flex;gap:.3rem;padding:.5rem 0}
.typ i{width:.35rem;height:.35rem;border-radius:50%;background:var(--mu);animation:br calc(1.2s*var(--k)) ease-in-out infinite}
.typ i:nth-child(2){animation-delay:.2s}.typ i:nth-child(3){animation-delay:.4s}
.chips{flex-shrink:0;display:flex;gap:.5rem;overflow-x:auto;padding:.3rem 0 .6rem}
.chip{flex-shrink:0;border:.5px solid var(--ln);border-radius:2rem;padding:.55rem .9rem;font-size:.82rem;color:var(--mu);white-space:nowrap}
.dock{flex-shrink:0;display:flex;gap:.6rem;align-items:center;padding:.2rem 0 1.1rem}
.dock input{flex:1;min-width:0;font:inherit;font-size:max(16px,1rem);color:var(--tx);background:var(--s1);border:.5px solid var(--ln);border-radius:2rem;padding:.8rem 1.1rem;outline:none;-webkit-user-select:text;user-select:text}
.dock input:focus{border-color:var(--ia)}

<script>
/* ============ DATA — testi e dati fittizi, modificali qui ============ */

const DATA={

  midnight:{n:'Midnight',bg:'#0c0d10',s1:'#15171b',s2:'#1d1f24',tx:'#eceae4',mu:'#878a92',ac:'#e4d2a6',ia:'#b9c6de'},

};

  luna:"radial-gradient(120% 50% at 50% -5%,rgba(170,190,240,.16),transparent 65%),rgba(120,140,190,.05)",
  mattina:"radial-gradient(120% 50% at 90% -5%,rgba(255,220,160,.20),transparent 65%),rgba(255,235,200,.05)",

const OPT={
  atm:['Atmosfera',[['luna','Luna'],['mattina','Mattina'],['notte','Notte'],['warm','Warm']]],
  k:['Animazioni',[['0.01','Minime'],['1','Normali'],['1.6','Cinematiche']]],

if(!(S.pal in PAL)&&S.pal!=='custom')S.pal=D0.pal;

/* ============ ASSISTANT — Parlami. Oggi risposte locali, nel telefono.
   Per collegare una vera AI si sostituisce solo Assistant.reply(): riceve la cronologia e restituisce {text, acts}. ============ */
const wait=ms=>new Promise(r=>setTimeout(r,ms));

const MEMS=(()=>{try{return JSON.parse(localStorage.getItem('uffa_mem')||'[]')}catch(e){return[]}})();

  if(SH.rounds.some(r=>r.author!==me()&&!r.replied_at))n.push(['C’è una sfida che ti aspetta.',['Giochi','giochi']]);

  if(!SH.answers.some(a=>a.user_id===me()&&a.day===todayKey()))n.push(['C’è ancora la domanda di oggi.',['La domanda di oggi','domanda']]);
  return n}
function letterFor(re){if(!paired())return [];const L=SH.letters.filter(l=>l.author!==me());if(!L.length)return [];

function memCapture(raw){if(raw.length>80||/\?/.test(raw))return null;
  const m=raw.trim().match(/^(?:a me\s+)?(mi piace|mi piacciono|adoro|non sopporto|detesto|non mi piace|non mi piacciono)\s+(.{2,60}?)[\s.!…]*$/i);if(!m)return null;
  const k=/^(non|detesto)/i.test(m[1])?'no':'piace',v=m[2].trim();
  if(MEMS.some(x=>x.k===k&&norm(x.v)===norm(v)))return {text:'Lo so già. Ce l’ho segnato.'};
  PENDMEM={k,v};return {text:`Vuoi che me lo ricordi? «${k==='no'?'Non ti piace':'Ti piace'} ${v}». Resta solo su questo telefono.`,acts:[['Sì, ricordalo','!pm-yes'],['No','!pm-no']]}}
function memAnswer(yes){if(!PENDMEM)return;if(yes){MEMS.push({...PENDMEM,at:Date.now()});savePM()}PENDMEM=null;
  const m={role:'assistant',text:yes?'Me lo ricordo. Lo trovi in “Cosa so di te”, e puoi cancellarlo quando vuoi.':'Va bene, lo lascio andare.',acts:yes?[['Cosa so di te','memoria']]:[]};
  CHAT.push(m);saveChat();push(msgHTML(m))}
function bella(){const o=[];const r=realMem();if(r)o.push(`Ti ricordi? «${r.t}», ${r.d}.`);
  const L=paired()?SH.letters.filter(l=>l.author!==me()):[];if(L.length)o.push(`${other()} ti ha lasciato ${L.length===1?'una lettera':L.length+' lettere'}. Sono lì, quando vuoi.`);
  if(meetD()>=0)o.push(meetSay());if(NAME!=='Nunzio')o.push(`${other()} ha costruito questo posto per te. Non è poco.`);

  FLOW={n:'bella'};return {text:pick(o)+' E tu? Una cosa bella di oggi, anche minuscola.',acts:(r?[['Ricordi','ricordi']]:[]).concat(L.length?[['Aprimi quando…','lettere']]:[])}}
/* percorsi guidati: poche domande, una alla volta, e si esce quando si vuole */
const FLOWS={
  sfogo(raw){const s=FLOW.s||0;

const GEN=['Ti ascolto.','Vai avanti, non ho fretta.','Capisco. Che cosa senti, in questo momento?','Dimmi di più, se ti va.','E tu come stai, in tutto questo?'];
let gi=0;
const Assistant={
  /* history: [{role:'user'|'assistant',text}] → Promise<{text, acts?}> */
  async reply(history){
    const raw=history[history.length-1].text;
    await wait(700+Math.min(1400,raw.length*12));
    const t=norm(raw);
    if(CRISIS.test(t)){FLOW=null;PENDMEM=null;return INT[0].r()}
    if(PENDMEM){if(/^(si|ok|va bene|certo|ricordalo|sì)\b/.test(t)){const p=PENDMEM;PENDMEM=null;MEMS.push({...p,at:Date.now()});savePM();return {text:'Me lo ricordo. Lo trovi in “Cosa so di te”.',acts:[['Cosa so di te','memoria']]}}
      if(/^no\b/.test(t)){PENDMEM=null;return {text:'Va bene, lo lascio andare.'}}PENDMEM=null}
    if(MOCK[raw])return MOCK[raw]();
    if(FLOW){if(/^(basta|stop|lascia stare|lascia perdere|niente|fine)\b/.test(t)){FLOW=null;return {text:'Va bene. Sono qui, se ti serve.'}}
      const pr=INT.find(x=>x.p&&x.k.test(t));if(pr){FLOW=null;return pr.r()}
      const f=FLOWS[FLOW.n];if(f){const r=f(raw);if(r)return r}}
    const mc=memCapture(raw);if(mc)return mc;
    for(const x of INT)if(x.k.test(t))return x.r();
    if(history.slice(-8).some(m=>m.crisis))return {crisis:true,text:`Sono qui. Hai sentito qualcuno? Telefono Amico risponde a qualsiasi ora al 02 2327 2327, e ${other()} è a un segnale di distanza.`,acts:HELP()};
    if(raw.length>140)return {text:'Grazie per avermelo detto. Tra tutto questo, cosa pesa di più?'};
    if(/\?\s*$/.test(raw))return {text:'Non ho una risposta vera, per ora. Tu cosa ne pensi?'};
    return {text:GEN[gi++%GEN.length]};
  }
};

const VAPID_PUB='BHC4pfdwxrC8ZXGrzP60ASTYL3PthIft_9MuHpqI6zFFl7Me8Zdxn55brmOOhRnBILbPhnyFgQyoYX2OMah737k';
const NTYPES=[['signals','Ti penso','Quando ti manda un segnale.'],['need','Ho bisogno di te','Quando ha bisogno di te.'],['games','Giochi','Quando ti sfida o gioca la tua sfida.'],['letters','Lettere','Quando te ne lascia una.'],['surprises','Sorprese','Quando te ne manda una subito.'],['answers','La domanda di oggi','Quando risponde.'],['memories','Ricordi','Quando ne aggiunge uno.'],['songs','Canzoni','Quando te ne manda una.']];
const NP={sub:null,prefs:{},loaded:false,busy:false};
const pushSupported=()=>'serviceWorker' in navigator&&'PushManager' in window&&'Notification' in window;
const standalone=()=>navigator.standalone===true||(typeof matchMedia==='function'&&matchMedia('(display-mode: standalone)').matches);
const b64u=x=>{const p='='.repeat((4-x.length%4)%4),r=atob((x+p).replace(/-/g,'+').replace(/_/g,'/'));return Uint8Array.from(r,c=>c.charCodeAt(0))};
async function loadPush(){if(!pushSupported()||!paired()){NP.loaded=true;return}
  try{const reg=await navigator.serviceWorker.getRegistration();const sub=reg?await reg.pushManager.getSubscription():null;NP.sub=sub||null;
    if(sub){const{data}=await safeQ(sb.from('push_subs').select('prefs').eq('endpoint',sub.endpoint).maybeSingle());NP.prefs=(data&&data.prefs)||{}}}catch(e){}
  NP.loaded=true}
function pushOn(){if(NP.busy)return;const perm=Notification.requestPermission();NP.busy=true;rerender();
  Promise.resolve(perm).then(async p=>{
    if(p!=='granted'){NP.busy=false;rerender();return toast('Notifiche non permesse.')}
    try{const reg=await navigator.serviceWorker.register('sw.js');await navigator.serviceWorker.ready;
      const sub=await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:b64u(VAPID_PUB)}),j=sub.toJSON();
      const prefs={};NTYPES.forEach(([k])=>prefs[k]=true);
      const{error}=await safeQ(sb.from('push_subs').upsert({user_id:me(),endpoint:j.endpoint,p256dh:j.keys.p256dh,auth:j.keys.auth,prefs,updated_at:new Date().toISOString()},{onConflict:'endpoint'}));
      if(error)throw 0;NP.sub=sub;NP.prefs=prefs;hap([10,40,10]);toast('Notifiche attive.')}
    catch(e){toast('Non è stato possibile attivarle. Riprova.')}
    NP.busy=false;rerender()})}
async function pushPref(k){if(!NP.sub)return;NP.prefs={...NP.prefs,[k]:NP.prefs[k]===false};rerender();hap(8);
  const{error}=await safeQ(sb.from('push_subs').update({prefs:NP.prefs,updated_at:new Date().toISOString()}).eq('endpoint',NP.sub.endpoint));
  if(error)toast('Non salvato. Riprova.')}
async function pushOff(){if(!NP.sub)return;const ep=NP.sub.endpoint;try{await NP.sub.unsubscribe()}catch(e){}
  await safeQ(sb.from('push_subs').delete().eq('endpoint',ep));NP.sub=null;NP.prefs={};rerender();toast('Notifiche disattivate su questo telefono.')}

    ${past.length?`<p class="mu sm" style="margin:2.2rem 0 .8rem">I giorni scorsi</p>${past.map(d=>`<div class="card" style="margin-bottom:.75rem"><span class="mu sm">${fmtDay(d)}</span><div style="font:1.1rem var(--serif);margin:.3rem 0 .5rem">${esc(qOf(d))}</div>${SH.answers.filter(x=>x.day===d).map(x=>`<p class="mu sm" style="margin:.2rem 0;white-space:pre-wrap;overflow-wrap:break-word"><span style="color:var(--tx)">${x.user_id===u?'Tu':esc(who)}:</span> ${esc(x.answer)}</p>`).join('')}</div>`).join('')}`:''}`},

  nuovoricordo:()=>`${head('Un ricordo')}<div class="set"><input class="fld" id="mt" placeholder="Titolo" autocomplete="off"></div>
  <div class="set"><label>Quando</label><input class="fld" id="mdd" type="date"></div>
  <div class="set"><input class="fld" id="ml" placeholder="Dove (facoltativo)" autocomplete="off"></div>
  <div class="set"><textarea class="fld" id="mx" rows="6" placeholder="Com’è andata."></textarea></div>
  <button class="card cta tap" data-act="mem-save">Tienilo</button>
  <p class="mu sm" style="margin-top:1rem">Lo vedrete tutti e due. Il luogo lo scrivi tu: Uffa. non usa la posizione.</p>`,

  notifiche:()=>{const h=head('Notifiche')+'<p class="hi" style="margin:-.8rem 0 1.4rem">Scegli cosa farti arrivare.</p>';
    if(!pushSupported())return h+`<p class="mu" style="line-height:1.5">${standalone()?'Questo telefono non permette le notifiche web: serve iOS 16.4 o successivo.':'Per le notifiche apri Uffa. dall’icona sulla schermata Home, non da Safari.'}</p>`;
    if(!paired())return h+'<p class="mu">Collegatevi prima in Tu → Account.</p>';
    if(Notification.permission==='denied')return h+'<p class="mu" style="line-height:1.5">Le notifiche sono bloccate. Si riattivano da Impostazioni → Notifiche → Uffa.</p>';
    if(!NP.loaded)return h+'<p class="mu">Un momento…</p>';
    if(!NP.sub)return h+`<button class="card cta tap" data-act="push-on">${NP.busy?'…':'Attiva le notifiche'}</button><p class="mu sm" style="margin-top:1rem;line-height:1.5">Solo su questo telefono. Il testo di lettere, risposte e sorprese non compare mai nella notifica. Niente “online”, niente “ha visto”.</p>`;
    return h+list(NTYPES,([k,t,d])=>{const on=NP.prefs[k]!==false;return `<button class="card row tap" data-act="push-pref" data-k="${k}"><span><span style="display:block">${t}</span><span class="mu sm" style="font-family:var(--sans)">${d}</span></span><span class="tag" style="${on?'color:var(--tx);border-color:var(--ia)':''}">${on?'Sì':'No'}</span></button>`})
      +'<button class="mu sm" style="margin-top:1.2rem;min-height:2.75rem" data-act="push-off">Disattiva su questo telefono</button>'},

  sfida:()=>!RGS?`${head('Giochi')}<p class="mu">Torna ai giochi e scegli una sfida.</p>`:`${head(RG[RGS.g].t)}<p class="mu sm" style="margin:-.8rem 0 1.4rem">${RGS.mode==='new'?'Rispondi tu. Poi toccherà a '+esc(other())+'.':'Sfida di '+esc(other())+'.'}</p><div id="gm"></div>`,
  sfidares:()=>!RGR?`${head('Giochi')}<p class="mu">Nessun risultato da mostrare.</p>`:`${head(RG[RGR.game].t)}${rgDetailHTML(RGR)}`,

  sorprese:()=>`${head('Sorpresa.')}<p class="hi" style="margin:-.8rem 0 1.6rem">Preparane una. Solo tu saprai quando arriva.</p>
  ${surTop()}
  <div class="set"><label>Cosa</label><div class="chips w">${cs('type',['Messaggio','Foto','Canzone','Disegno','Domanda','Mini gioco','Ricordo'])}</div><p class="mu sm" id="th" style="margin:.3rem 0 0"></p></div>
  <div class="set"><label>Il tuo testo</label><textarea class="fld" id="st" placeholder="Scrivi qualcosa"></textarea></div>
  <div class="set"><label>Quando</label><div class="chips w">${cs('when',['Subito','Data e ora','A caso in un periodo'])}</div><div id="wh">${whH()}</div></div>
  <div class="set"><label>Tono</label><div class="chips w">${cs('tone',['Discreto','Misterioso','Dolce','Giocoso'])}</div></div>
  <button class="card cta tap" data-act="prep">Prepara</button>
  ${surNote()}<div id="spl">${spl()}</div>`,

  custom:()=>{const seg=k=>`<div class="set"><label>${OPT[k][0]}</label><div class="seg">${OPT[k][1].map(([v,l])=>`<button data-set="${k}:${v}" class="${S[k]===v?'on':''}">${l}</button>`).join('')}</div></div>`;
  return `${head('Personalizza')}
  <div class="pv"><p class="mu" style="font-size:.78rem;margin:0 0 .5rem">Così apparirà Uffa.</p><div class="card pvc"><div class="pvh">Ciao, ${NAME}.</div><div class="pvr"><span>Ti penso</span>${I.rings}</div><div class="pvs"><span>Parlami.</span><i>Sono qui.</i></div></div></div>
  <div class="set"><label>Palette</label><div class="pg">${list(Object.keys(PAL),k=>{const p=PAL[k];return `<button class="sw ${S.pal===k?'on':''}" data-set="pal:${k}" style="--b:${p.bg};--t:${p.tx};--a:${p.ac}">${p.n}</button>`})}
  <div class="sw ${S.pal==='custom'?'on':''}" id="swc" style="--b:var(--s2);--t:var(--tx);--a:${S.accent}">Custom<input type="color" id="cc" value="${S.accent}" aria-label="Colore principale"></div></div></div>
  ${seg('atm')}
  <div class="set"><label>Font</label>${list(Object.keys(FONTS),k=>`<button class="fp ${S.font===k?'on':''}" data-set="font:${k}" style="font-family:${FONTS[k].d}"><span><b>Uffa.</b><br><small>Questo posto è tuo.</small></span><small style="font-family:${SYS}">${FONTS[k].n}</small></button>`)}</div>
  ${seg('k')}${seg('card')}${seg('fs')}`},

  account:()=>{
    if(!sb)return `${head('Account')}<p class="hi" style="margin:-.8rem 0 1.6rem">Non disponibile su questo telefono: Uffa. resta locale.</p>`;
    if(!AUTH.ready)return `${head('Account')}<p class="mu" style="margin:.6rem 0">Un momento…</p>`;
    if(AUTH.user)return `${head('Account')}<p class="hi" style="margin:-.8rem 0 1.6rem">${esc(AUTH.user.email||'')}</p>
    <div class="set"><label>Nome da mostrare</label><input class="fld" id="dn" placeholder="Come vuoi chiamarti qui" value="${esc(AUTH.profile&&AUTH.profile.display_name||'')}"></div>
    <button class="card cta tap" data-act="save-name">Salva</button>
    ${pairHTML()}
    <button class="card row tap" style="margin-top:1.4rem" data-act="logout">Esci<span class="mu">›</span></button>`;
    return `${head('Account')}<p class="hi" style="margin:-.8rem 0 1rem">${AUTH.mode==='signup'?'Crea il tuo accesso.':'Accedi al tuo Uffa.'}</p>
    <div class="chips w" style="margin-bottom:1.3rem">
      <button class="chip ${AUTH.mode==='login'?'on':''}" data-act="auth-mode" data-v="login">Accedi</button>
      <button class="chip ${AUTH.mode==='signup'?'on':''}" data-act="auth-mode" data-v="signup">Crea account</button>
    </div>
    <div class="set"><input class="fld" id="ae" type="email" inputmode="email" autocapitalize="off" autocomplete="email" placeholder="Email"></div>
    <div class="set"><input class="fld" id="ap" type="password" autocomplete="${AUTH.mode==='signup'?'new-password':'current-password'}" placeholder="Password"></div>
    <button class="card cta tap" data-act="auth-submit">${AUTH.busy?'…':AUTH.mode==='signup'?'Crea account':'Accedi'}</button>
    <p class="mu sm" style="margin-top:1rem;min-height:1.2em">${esc(AUTH.err||'')}</p>`;
  },

  profilo:()=>`${head('Tu.')}<div class="center" style="min-height:0;padding:1rem 0 2.2rem"><div class="orb q inf" style="width:7rem;height:7rem;font:2.6rem var(--serif)">${NAME[0]}</div>
  <p style="font:1.9rem var(--serif);margin:0">${NAME}</p><p class="hi" style="margin:0">Questo posto è tuo.</p></div>
  ${list(TR,([k,v,l])=>`<button class="card row tap" ${k==='go'?`data-go="${v}"`:k==='info'?`data-act="info" data-k="${v}"`:`data-act="${v}"`}>${l}<span class="mu">›</span></button>`)}
  <p class="mu sm" style="text-align:center;margin-top:2.4rem;opacity:.6">Uffa.</p>`
};

/* ============ ROUTER ============ */
let stack=[];
function go(n,first){
  const el=document.createElement('section');el.className='screen'+(n==='parlami'?' chat':'');el.innerHTML=V[n]();app.appendChild(el);if(n==='parlami'){const m=el.querySelector('.msgs');m.scrollTop=m.scrollHeight}
  stack.push({n,el});
  first?el.classList.add('on'):requestAnimationFrame(()=>requestAnimationFrame(()=>el.classList.add('on')));
  if(n==='home'){setTimeout(()=>el.querySelector('#gift')?.classList.add('on'),3000*K()+400);dynLoop(el)}
  HOOK[n]&&HOOK[n](el);
  if(!first)hap(6);
}
function back(){
  if(stack.length<2)return;
  const {el}=stack.pop();el.classList.remove('on');hap(6);
  setTimeout(()=>el.remove(),520*K()+60);
}

/* ============ INTERAZIONI ============ */
function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('on'),1800)}
function sheet(h){const s=document.createElement('div');s.id='sheet';s.innerHTML=`<div class="card">${h}<button class="tag" style="margin-top:1.4rem;min-height:2.75rem;padding:0 1.2rem;font-size:.85rem" data-act="close">Chiudi</button></div>`;
  s.onclick=e=>{if(e.target===s)close()};document.body.append(s);requestAnimationFrame(()=>s.classList.add('on'));
  function close(){s.classList.remove('on');setTimeout(()=>s.remove(),350*K()+50)};s.close=close}
const DYN=[{t:'Ti va di giocare?',to:'giochi'},{t:'Un ricordo per oggi.',to:'ricordi'},{t:'Un minuto per te.',to:'relax'},{t:'Che cosa vuoi ascoltare?',to:'musica'}];
function dynList(){const L=[];
  if(paired()){const rec=SH.sur.filter(x=>Date.now()-new Date(x.deliver_at)<3*864e5);if(rec.length)L.push({t:'Ho qualcosa per te.',to:'sorprese'});
    if(SH.letters.some(l=>l.author!==me()))L.push({t:'Aprimi quando…',to:'lettere'});
    if(SH.songs.some(x=>x.author!==me()&&Date.now()-new Date(x.created_at)<2*864e5))L.push({t:'Una canzone per te.',to:'canzoni'});
    if(SH.rounds.some(r=>r.author!==me()&&!r.replied_at))L.push({t:'Tocca a te: c’è una sfida.',to:'giochi'});
    if(!SH.answers.some(a=>a.user_id===me()&&a.day===todayKey()))L.push({t:'C’è una domanda per oggi.',to:'domanda'})}
  return L.concat(DYN)}
function dynLoop(el){let i=0;const g=el.querySelector('#gift');
  const iv=setInterval(()=>{if(!el.isConnected)return clearInterval(iv);g.classList.remove('on');
    setTimeout(()=>{const L=dynList();i=(i+1)%L.length;g.dataset.go=L[i].to;g.querySelector('span').textContent=L[i].t;g.classList.add('on')},1300*K()+300)},7500)}
function reveal(el){const r=el.querySelectorAll('.rv');
  if(!window.IntersectionObserver)return r.forEach(x=>x.classList.add('in'));
  const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('in');io.unobserve(e.target)}}),{root:el,threshold:.2});r.forEach(x=>io.observe(x))}
function ping(b){
  const res=sendSignal(SI);hap([10,60,10,140,20]);
  (K()>1.2?[0,260,520]:[0,260]).forEach(d=>setTimeout(()=>{const r=document.createElement('i');r.className='ring';b.appendChild(r);setTimeout(()=>r.remove(),1900*K()+50)},d*K()));
  const s=document.createElement('i');s.className='sig';b.appendChild(s);setTimeout(()=>s.remove(),2500*K()+50);
  b.classList.add('sent');
  const sub=$('#sub'),q=Math.max(K(),.5);sub.style.opacity=0;
  setTimeout(()=>{res.then(t=>{sub.textContent=t;sub.style.opacity=1})},1500*q);
  clearTimeout(ping.t);ping.t=setTimeout(()=>{b.classList.remove('sent');sub.style.opacity=0;setTimeout(()=>{sub.textContent='Tocca per mandare un segnale.';sub.style.opacity=1},500)},4800*q);
}
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-go],[data-act],[data-set]');if(!t)return;
  if(t.dataset.go)return go(t.dataset.go);
  if(t.dataset.set){const[k,v]=t.dataset.set.split(':');S[k]=v;apply();save();hap(8);
    document.querySelectorAll(`[data-set^="${k}:"]`).forEach(b=>b.classList.toggle('on',b===t));if(k==='pal')$('#swc')?.classList.remove('on');return}
  const a=t.dataset.act;
  if(a==='back')back();
  else if(a==='ping')ping(t);
  else if(a==='toast')toast('In arrivo.');
  else if(a==='gift')sheet('<p style="font:1.7rem var(--serif);margin:0 0 .5rem">Ho qualcosa per te.</p><p class="mu" style="margin:0">Qui comparirà quello che ti lascio.</p>');
  else if(a==='close')$('#sheet').close();
  else if(a==='replay')intro(1);
  else if(a==='sig'){SI=+t.dataset.i;$('.lb').textContent=SIG[SI][1];document.querySelectorAll('[data-act=sig]').forEach(b=>b.classList.toggle('on',b===t))}
  else if(a==='play'){GI=+t.dataset.i;go('gioco')}
  else if(a==='sp'){const k=t.dataset.k;SP[k]=t.dataset.v;t.parentNode.querySelectorAll('.chip').forEach(b=>b.classList.toggle('on',b===t));
    if(k==='when')$('#wh').innerHTML=whH();if(k==='type')$('#th').textContent=HINT[SP.type]||''}
  else if(a==='prep')prep();
  else if(a==='spdel'){SPL.splice(+t.dataset.i,1);saveS();$('#spl').innerHTML=spl()}
  else if(a==='mem'){MI=+t.dataset.i;go('ricordo')}
  else if(a==='memn'){MI=+t.dataset.i;const e=stack[stack.length-1].el;e.innerHTML=V.ricordo();e.scrollTop=0;hap(6)}
  else if(a==='info')sheet(TU[t.dataset.k]());
  else if(a==='need')needSheet();
  else if(a==='need-send'){const sh=$('#sheet');sendSignal(4).then(m=>{if(sh&&sh.close)sh.close();toast(m)})}
  else if(a==='letgo')letGo();
  else if(a==='song-save')saveSong();
  else if(a==='song-del')delShared('songs',t.dataset.id);
  else if(a==='rg-new'){if(!paired())return toast('Collegatevi prima in Tu → Account.');RGS={mode:'new',g:t.dataset.g,items:RG[t.dataset.g].make(),ans:[]};go('sfida')}
  else if(a==='rg-play'){const r=SH.rounds.find(x=>x.id===t.dataset.id);if(r){RGS={mode:'reply',g:r.game,items:r.data.items,ans:[],round:r};go('sfida')}}
  else if(a==='rg-res'){const r=SH.rounds.find(x=>x.id===t.dataset.id);if(r){RGR=r;go('sfidares')}}
  else if(a==='push-on')pushOn();
  else if(a==='push-pref')pushPref(t.dataset.k);
  else if(a==='push-off')pushOff();
  else if(a==='occ'){LOC=t.dataset.v;t.parentNode.querySelectorAll('.chip').forEach(b=>b.classList.toggle('on',b===t))}
  else if(a==='letter-save')saveLetter();
  else if(a==='letter-open'){const l=SH.letters.find(x=>x.id===t.dataset.id);if(l){hap([8,50,8]);sheet(`<p class="mu sm" style="margin:0 0 .8rem">${esc(l.occasion)} · da ${esc(other())}</p><p style="font:1.25rem/1.55 var(--serif);white-space:pre-wrap;overflow-wrap:break-word;margin:0">${esc(l.body)}</p>`)}}
  else if(a==='letter-del')delShared('letters',t.dataset.id);
  else if(a==='meet-save')saveMeet();
  else if(a==='meet-clear')clearMeet();
  else if(a==='dq-save')saveAnswer();
  else if(a==='sur-open'){const x=SH.sur.find(z=>z.id===t.dataset.id);if(x)openSur(x,0)}
  else if(a==='sur-del')delShared('surprises',t.dataset.id);
  else if(a==='mem-save')saveMemory();
  else if(a==='mem-del')delShared('memories',t.dataset.id,1);
  else if(a==='chat-clear')sheet('<p style="font:1.6rem var(--serif);margin:0 0 .5rem">Cancellare la conversazione?</p><p class="mu" style="margin:0 0 1rem">Sparisce da questo telefono e non si può recuperare.</p><button class="card cta tap" data-act="chat-clear-yes">Cancella</button>');
  else if(a==='pm-yes')memAnswer(true);
  else if(a==='pm-no')memAnswer(false);
  else if(a==='pm-del'){MEMS.splice(+t.dataset.i,1);savePM();rerender()}
  else if(a==='pm-clear')sheet('<p style="font:1.6rem var(--serif);margin:0 0 .5rem">Dimenticare tutto?</p><p class="mu" style="margin:0 0 1rem">Sparisce da questo telefono e non si può recuperare.</p><button class="card cta tap" data-act="pm-clear-yes">Dimentica tutto</button>');
  else if(a==='pm-clear-yes'){MEMS.length=0;savePM();const sh=$('#sheet');if(sh&&sh.close)sh.close();rerender();toast('Dimenticato.')}
  else if(a==='chat-clear-yes'){CHAT.length=0;saveChat();FLOW=null;PENDMEM=null;const sh=$('#sheet');if(sh&&sh.close)sh.close();const tp=stack[stack.length-1];if(tp&&tp.n==='parlami')tp.el.innerHTML=V.parlami();toast('Cancellata.')}
  else if(a==='auth-mode'){AUTH.mode=t.dataset.v;AUTH.err='';renderAccountIfOpen()}
  else if(a==='auth-submit')authSubmit();
  else if(a==='logout')authLogout();
  else if(a==='save-name')saveName();
  else if(a==='pair-create')pairCall('create_couple');
  else if(a==='pair-join')pairJoin();
  else if(a==='pair-refresh')pairRefresh();
  else if(a==='send')send($('#ci').value);
  else if(a==='quick')send(t.dataset.q);
  else if(a==='mood'){if(t.dataset.i==='2'&&paired())return go('canzoni');const m=MUSIC.actions[t.dataset.i];sheet(`<p style="font:1.7rem var(--serif);margin:0 0 .5rem">${m[0]}</p><p class="mu" style="margin:0 0 .6rem">${m[1]}</p><p class="mu sm" style="margin:0">Disponibile dopo il collegamento a Spotify.</p>`)}
});

/* ============ INTRO CINEMATOGRAFICA ============ */
/* prima apertura: introduzione completa una sola volta; poi apertura immediata */
const OB='uffa_ob';
const seen=()=>{try{return localStorage.getItem(OB)==='1'}catch(e){return false}};
const markSeen=()=>{try{localStorage.setItem(OB,'1')}catch(e){}};
const OBL=['Parlare.','Mandare un segnale.','Giocare.','Ascoltare musica.','Condividere momenti.','Conservare ricordi.','Ricevere sorprese.','Rendere tutto a modo tuo.'];
function quick(){app.innerHTML='';stack=[];const d=document.documentElement;d.classList.add('q');go('home',1);setTimeout(()=>d.classList.remove('q'),900)}
function intro(force){
  if(!force&&seen())return quick();
  const o=document.createElement('div');o.id='intro';o.innerHTML='<p></p><span class="sk">Tocca per saltare</span>';document.body.append(o);
  const p=o.firstChild,q=Math.max(K(),.6),L=[`Ciao, ${NAME}.`,'Questo posto è tuo.',OBL],H=[2400,4000,(OBL.length*.4+2.4)*1000];let i=0,done=false;
  const end=()=>{if(done)return;done=true;markSeen();app.innerHTML='';stack=[];go('home',1);o.classList.add('gone');setTimeout(()=>o.remove(),1200)};
  o.onclick=end;
  setTimeout(function next(){
    if(done)return;if(i>=L.length)return end();
    const c=i,x=L[i++];
    p.innerHTML=Array.isArray(x)?`<span class="cl">${x.map((t,j)=>`<i style="transition-delay:${(j*.4*q).toFixed(2)}s">${t}</i>`).join('')}</span>`:x;
    void p.offsetWidth;p.className='show'+(c===1?' big':'');
    setTimeout(()=>{if(done)return;p.className=c===1?'big':'';setTimeout(next,Math.max(1300,1400*q))},H[c]*q);
  },900);
}

document.addEventListener('input',e=>{if(e.target.id!=='rq')return;const w=$('#rlw');w.classList.add('s');w.innerHTML=rlw(e.target.value,1)});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='ci'){e.preventDefault();send(e.target.value)}});
document.addEventListener('input',e=>{if(e.target.id!=='cc')return;S.pal='custom';S.accent=e.target.value;apply();save();
  document.querySelectorAll('[data-set^="pal:"]').forEach(b=>b.classList.remove('on'));const c=$('#swc');c.classList.add('on');c.style.setProperty('--a',S.accent)});
/* tastiera iOS: tiene la barra di scrittura sopra la tastiera */
if(window.visualViewport){const vv=visualViewport,f=()=>{const kb=innerHeight-vv.height>120,pt=parseFloat(getComputedStyle(document.documentElement).paddingTop)||0;
  document.documentElement.style.setProperty('--vh',kb?(vv.height-pt)+'px':'100%');if(kb)scrollTo(0,0)};vv.addEventListener('resize',f);vv.addEventListener('scroll',f)}
const app=$('#app');
apply();intro();
</script>
